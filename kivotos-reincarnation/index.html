<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf8ff"><title>키보토스 환생 추첨기</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:linear-gradient(160deg,#f8fdff,#e9f8ff 55%,#eef1ff);color:#17334b;min-height:100vh}.app{max-width:620px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}h1{font-size:30px;margin:8px 0 4px;letter-spacing:-1.5px}.sub{color:#668095;font-size:13px;margin-bottom:18px}.card,.panel{background:#ffffffdd;border:1px solid #fff;border-radius:25px;box-shadow:0 16px 45px #3e8cba20}.card{padding:28px 18px 18px;text-align:center;min-height:320px}.label{font-size:14px;color:#708495;margin-top:14px}.name{font-size:46px;font-weight:900;letter-spacing:-2px;margin:20px 0 6px;word-break:keep-all}.full{min-height:24px;font-weight:700;color:#688096}.school{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:999px;background:#edf8ff;color:#24749d;font-size:13px;font-weight:800}.btn{width:100%;border:0;border-radius:18px;min-height:60px;margin-top:22px;background:linear-gradient(135deg,#2d9cdb,#5869f4);color:#fff;font-size:18px;font-weight:900;touch-action:manipulation}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.45}.smallrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{min-height:46px;margin-top:10px;border:1px solid #dceaf2;border-radius:15px;background:#fff;color:#17334b;font-weight:800}.panel{margin-top:14px;padding:16px}.status{font-size:13px;color:#657d90;line-height:1.5}.list{margin-top:12px;max-height:320px;overflow:auto;border-top:1px solid #e6eff4}.row{padding:11px 3px;border-bottom:1px solid #edf3f6;font-size:14px}.row b{display:block}.row span{color:#72889a;font-size:12px}.hide{display:none}.error{color:#b04c64;font-weight:700}footer{font-size:11px;color:#74899a;text-align:center;line-height:1.5;margin:18px 4px}</style></head><body><main class="app"><h1>키보토스 환생 추첨기</h1><div class="sub">플레이어블 여부와 상관없이 학생 단위로 1명씩 완전 랜덤</div><section class="card"><div class="label" id="label">키보토스 학생 명단을 불러오는 중…</div><div class="name" id="name">☁️</div><div class="full" id="full">잠깐만!</div><div class="school" id="school">데이터 로딩</div><button class="btn" id="draw" type="button" disabled>완전 랜덤 환생하기</button><div class="smallrow"><button class="small" id="copy" type="button" disabled>결과 복사</button><button class="small" id="toggle" type="button">전체 명단</button></div></section><section class="panel"><div class="status" id="status">학생 데이터를 불러오고 있어.</div><div class="list hide" id="list"></div></section><footer>의상·수영복·정월 등의 이격은 같은 학생으로 합쳐서 한 번만 추첨해. 데이터는 공개 Blue Archive 캐릭터 데이터에서 실시간으로 불러온다.</footer></main><script>const DATA='https://agent-0808.github.io/BA-characters-internal-id/data/students.json';const $=id=>document.getElementById(id);let pool=[],current=null;const excluded=['Hatsune Miku','Misaka Mikoto','Shokuhou Misaki','Saten Ruiko','初音未来','御坂美琴','食蜂操祈','佐天泪子'];function secureIndex(n){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1),lim=4294967296-(4294967296%n);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}return Math.floor(Math.random()*n)}function clean(s){return String(s||'').trim()}function renderList(){$('list').innerHTML=pool.slice().sort((a,b)=>clean(a.name_kr).localeCompare(clean(b.name_kr),'ko')).map(s=>`<div class="row"><b>${clean(s.name_kr)||clean(s.name_jp)||clean(s.name_en)}</b><span>${clean(s.name_jp)} · ID ${s.id}</span></div>`).join('')}async function load(){try{const r=await fetch(DATA,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const all=await r.json();pool=all.filter(s=>{const names=[s.name_en,s.name_jp,s.name_kr,s.name_cn].map(clean);return !names.some(n=>excluded.includes(n))});$('label').textContent='환생 준비 완료';$('name').textContent='?';$('full').textContent=`현재 ${pool.length}명 중 동일 확률`;$('school').textContent='각 학생 1 / '+pool.length;$('draw').disabled=false;$('status').textContent=`학생 ${pool.length}명을 불러왔어. 같은 학생의 의상 이격은 pages로 묶여 있으므로 학생당 한 번만 들어간다.`;renderList()}catch(e){$('label').textContent='데이터 로딩 실패';$('name').textContent='ㅠㅠ';$('full').textContent='Safari에서 새로고침해줘';$('school').textContent='네트워크 오류';$('status').innerHTML='<span class="error">학생 데이터를 불러오지 못했어: '+e.message+'</span>'}}function draw(){if(!pool.length)return;current=pool[secureIndex(pool.length)];const kr=clean(current.name_kr)||clean(current.name_jp)||clean(current.name_en);$('label').textContent='눈을 뜨니, 나는…';$('name').textContent=kr;$('full').textContent=[clean(current.name_jp),clean(current.name_en)].filter(Boolean).join(' · ');$('school').textContent='학생 ID '+current.id;$('draw').textContent='다시 환생하기';$('copy').disabled=false}async function copy(){if(!current)return;const t=`블루 아카이브에서 환생한다면… 나는 ${clean(current.name_kr)||clean(current.name_jp)||clean(current.name_en)}로 환생했다!`;try{await navigator.clipboard.writeText(t);$('copy').textContent='복사 완료!';setTimeout(()=>$('copy').textContent='결과 복사',1200)}catch(e){prompt('아래 결과를 복사해줘',t)}}$('draw').onclick=draw;$('copy').onclick=copy;$('toggle').onclick=()=>{const l=$('list');l.classList.toggle('hide');$('toggle').textContent=l.classList.contains('hide')?'전체 명단':'명단 닫기'};load();</script></body></html>
