<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#eaf8ff"><title>키보토스 환생 추첨기</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#edf9ff}body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#17344d;background:radial-gradient(circle at 10% -10%,#fff 0 20%,transparent 45%),linear-gradient(155deg,#f8fdff,#e7f7ff 55%,#eef1ff)}button,input{font:inherit}button{touch-action:manipulation}.app{width:min(100%,620px);margin:auto;padding:max(18px,env(safe-area-inset-top)) 15px max(24px,env(safe-area-inset-bottom))}h1{font-size:30px;letter-spacing:-1.5px;line-height:1.05;margin:5px 0 7px}.lead{font-size:13px;line-height:1.55;color:#6d8394}.rule{display:inline-block;margin:9px 0 14px;padding:7px 11px;border:1px solid #dcecf4;border-radius:999px;background:#fff;font-size:12px;font-weight:850;color:#347998}.card,.panel{background:#ffffffeb;border:1px solid #fff;border-radius:24px;box-shadow:0 17px 50px #387fa51f}.card{text-align:center;padding:27px 17px 17px;min-height:310px}.label{font-size:13px;color:#6d8394;font-weight:750}.name{font-size:clamp(38px,11vw,55px);font-weight:950;letter-spacing:-2.4px;margin:24px 0 10px;word-break:keep-all}.detail{min-height:23px;color:#668093;font-size:13px;font-weight:750}.draw{width:100%;min-height:62px;border:0;border-radius:18px;margin-top:24px;background:linear-gradient(135deg,#319bd6,#5969f2);color:#fff;font-size:19px;font-weight:950;box-shadow:0 12px 25px #4f6ce641}.draw:active,.sub:active{transform:scale(.985)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.sub{min-height:47px;border:1px solid #dcecf4;border-radius:15px;background:#fff;color:#17344d;font-weight:850}.sub:disabled{opacity:.45}.panel{padding:15px;margin-top:13px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}.toggle label{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900}.toggle input{width:21px;height:21px;accent-color:#438fe8}.count{font-size:12px;color:#6d8394}.status{margin-top:10px;font-size:13px;line-height:1.5;color:#6d8394}.status b{color:#17344d}.search{width:100%;height:45px;border:1px solid #dcecf4;border-radius:14px;background:#fff;padding:0 12px;margin-top:10px}.list{max-height:360px;overflow:auto;margin-top:9px;border-top:1px solid #dcecf4}.row{padding:10px 3px;border-bottom:1px solid #eaf1f5;font-size:14px;font-weight:800}.row small{float:right;color:#7b8d9b;font-size:11px}.hide{display:none!important}.history{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.history span{flex:none;padding:7px 10px;border:1px solid #dcecf4;border-radius:999px;background:#fff;font-size:12px;font-weight:800}.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#17364c;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;font-weight:850;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}footer{font-size:11px;color:#74899a;text-align:center;line-height:1.55;margin:16px 3px}</style></head><body><main class="app"><h1>키보토스 환생 추첨기</h1><div class="lead">한국어 고유명만 넣었어. 플레이어블 여부와 상관없이 모두 같은 확률로 뽑혀.</div><div class="rule">남성·수컷·숫자 NPC·이름 없는 모브 제외</div><section class="card"><div class="label" id="label">환생할 준비가 됐어</div><div class="name" id="name">?</div><div class="detail" id="detail">버튼을 눌러 운명을 확인해</div><button class="draw" id="draw" type="button">완전 랜덤 환생하기</button><div class="actions"><button class="sub" id="copy" type="button" disabled>결과 복사</button><button class="sub" id="show" type="button">전체 명단</button></div></section><section class="panel"><div class="toggle"><label><input id="extras" type="checkbox" checked>여성·무성 비학생도 포함</label><span class="count">검수된 6명</span></div><div class="status" id="status"></div></section><section class="panel hide" id="listPanel"><b>이름 있는 후보 전체</b><input class="search" id="search" placeholder="한국어 이름 검색" autocomplete="off"><div class="list" id="list"></div><button class="sub" id="close" type="button" style="width:100%;margin-top:10px">명단 닫기</button></section><section class="panel"><b>최근 환생</b><div class="history" id="history" style="margin-top:10px"><span>아직 없음</span></div></section><footer>여름·정월·드레스 같은 의상 이격은 같은 인물로 한 번만 들어가. 고유 이름 또는 고유 호칭이 있는 항목만 포함해.</footer></main><div class="toast" id="toast"></div><script>'use strict';const GIRLS=["아마치 니야","타카나시 호시노","우라와 하나코","야쿠시 사야","오토세 코타마","스미 세리나","츠키유키 미야코","츠치나가 히요리","이마시노 미사키","하카리 아츠코","마요이 시구레","쿠리무라 아이리","하타미 에리카","카쿠다테 카린","카스가 츠바키","스노하라 슌","요시노 니코","쿠로사키 코유키","소라사키 히나","류우게 키사키","아마미 노도카","치도리 미치루","요자쿠라 키라라","쿠로다테 하루나","카야마 레이죠","아케시로 루미","우스바 리츠","카케하시 스바루","리쿠하치마 아루","하야세 유우카","미즈하 미모리","오니카타 카요코","하누마 마코토","이치노세 아스나","텐도 아리스","무로카사 아카네","네코즈카 히비키","코사카 와카모","오노 츠쿠요","히무로 세나","소라이 사키","쿄고쿠 사츠키","우시오 노아","탄가 이부키","시모에 코하루","오마가리 하레","코제키 우이","시모쿠라 메구","카가미 치히로","아이키요 후우카","이즈미모토 에이미","코마카제 라브","미소노 미카","시시도우 이즈미","아사가오 하나에","이구사 하루카","스나오오카미 시로코","와카바 히나타","아라마키 야쿠모","텐진야마 오토기","키누가와 카스미","우자와 레이사","스노하라 코코나","시즈야마 마시로","츠카츠키 리오","타치바나 히카리","타치바나 노조미","카데노코지 유카리","미요시 타카네","켄자키 츠루기","쿠로미 세리카","사토하마 우미카","키리후지 나기사","카와와 시즈코","이사미 카에데","카스미자와 미유","와라쿠 치세","야스모리 미노리","우츠미 아오바","후와 렌게","아사기 무츠키","코누리 마키","쿄야마 카즈사","아키이즈미 모미지","키류 키쿄","노마사 레이","하나오카 유즈","아스마 토키","미카모 네루","시마 코노카","오토하나 스미레","히노미야 치나츠","사쿠라이 미요","이바라기 요시미","모리즈키 스즈미","이자요이 노노미","조마에 사오리","와카사 후유","오가타 칸나","코노에 미나","이오치 마리","카제쿠라 모에","키누이 레나","모토미야 치아키","유리조노 세이아","타카쿠라 쿠루미","우타즈미 사쿠라코","쿠와카미 카호","시치도 유키노","우시마키 주리","네무가키 후부키","나카츠카사 키리노","렌카와 체리노","시라오 에리","이타가키 카노에","아사히나 피나","이케쿠라 마리나","시로미 이오리","사시로 토모에","나카마사 이치카","오쿠소라 아야네","시라이시 우타하","나츠메 이로하","아오모리 미네","아지타니 히후미","엔도우 시미코","유토리 나츠","고료 나구사","사이바 모모이","사이바 미도리","와니부치 아카리","아케보시 히마리","하네카와 하스미","쿠다 이즈나","히메키 메루","아마우 아코","시라스 아즈사","아카시 준코","토요미 코토리","텐도 케이","시로코*테러","호시노*테러","나나가미 린","유라기 모모카","시라누이 카야","오키 아오이","이와비츠 아유무","하이네","스모모","연방학생회장","신 연방학생회장","인재자원실장","쿠치나시 유메","셰마타","게헨나의 뇌제","아즈마 미라이","하네모토 츠바사","미야우치 카나에","타카노스 스이코","이오자쿠 나고미","우토우 요우코","우루시바라 카구야","킨","메이","린카","신타니 카이","나나카도 아야메","쿠즈노하","아사쿠사 나츠키","코쿠리코","야부키 슈로","하부 아자미","아라타","미쿠리","칸바라 미스즈","타치기 마이아","아사기리 스오우","시이나 츠무기","히로미","우루와시 마나미","키요스미 아키라","쿠리하마 아케미","미츠이 쿄코","니야니야 교수","코모리 스미카","카자마키 마이","카와루 시논","소라"],EXTRAS=["아로나","프라나","베아트리체","얼굴 없는 카타시로","데카그라마톤","말쿠트"];const $=x=>document.getElementById(x);let current='',history=[];try{history=JSON.parse(localStorage.getItem('kivotos-v4-history')||'[]')}catch(e){}function pool(){return $('extras').checked?GIRLS.concat(EXTRAS):GIRLS.slice()}function idx(n){if(crypto&&crypto.getRandomValues){const a=new Uint32Array(1),m=4294967296,l=m-m%n;do{crypto.getRandomValues(a)}while(a[0]>=l);return a[0]%n}return Math.floor(Math.random()*n)}let tt;function toast(s){clearTimeout(tt);$('toast').textContent=s;$('toast').classList.add('show');tt=setTimeout(()=>$('toast').classList.remove('show'),1300)}function update(){const p=pool();$('status').innerHTML=`현재 <b>${p.length}명</b> · 1명당 약 <b>${(100/p.length).toFixed(3)}%</b><br>여자 학생·여자 NPC 학생 ${GIRLS.length}명${$('extras').checked?' + 여성/무성 비학생 '+EXTRAS.length+'명':''}`;renderList()}function renderList(){const q=$('search').value.trim().toLowerCase(),extra=$('extras').checked;const p=pool().filter(x=>x.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b,'ko'));$('list').innerHTML=p.map(x=>`<div class="row">${x}<small>${EXTRAS.includes(x)?'여성·무성 비학생':'여자 학생'}</small></div>`).join('')||'<div class="row">검색 결과 없음</div>'}function renderHistory(){$('history').innerHTML=history.length?history.map(x=>`<span>${x}</span>`).join(''):'<span>아직 없음</span>'}function draw(){const p=pool();$('draw').disabled=true;let t=setInterval(()=>{$('name').textContent=p[idx(p.length)];$('detail').textContent='운명 재구성 중…'},55);setTimeout(()=>{clearInterval(t);current=p[idx(p.length)];$('label').textContent='눈을 뜨니, 나는…';$('name').textContent=current;$('detail').textContent=EXTRAS.includes(current)?'여성·무성 비학생':'키보토스의 여자 학생';$('draw').textContent='다시 환생하기';$('draw').disabled=false;$('copy').disabled=false;history=[current,...history].slice(0,10);try{localStorage.setItem('kivotos-v4-history',JSON.stringify(history))}catch(e){}renderHistory();if(navigator.vibrate)navigator.vibrate(15)},700)}async function copy(){if(!current)return;const s=`블루 아카이브에서 환생한다면… 나는 ${current}로 환생했다!`;try{await navigator.clipboard.writeText(s);toast('결과를 복사했어.')}catch(e){const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('결과를 복사했어.')}}$('draw').onclick=draw;$('copy').onclick=copy;$('extras').onchange=update;$('show').onclick=()=>{$('listPanel').classList.remove('hide');renderList()};$('close').onclick=()=>$('listPanel').classList.add('hide');$('search').oninput=renderList;update();renderHistory();</script></body></html>
