r)return;let s=`블루 아카이브에서 환생한다면… 나는 ${cur.name} (${META[cur.type]})로 환생했다!`;try{await navigator.clipboard.writeText(s);toast('결과 복사 완료')}catch(e){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('결과 복사 완료')}}function stat(){let m=mp(),o=op(),p=pool();$('mobCount').textContent=m.length+'명';$('otherCount').textContent=o.length+'명';$('status').innerHTML=`고유 캐릭터 <b>${NAMES.length}명</b> · 현재 후보 <b>${p.length}명</b><br>한 후보당 약 <b>${(100/p.length).toFixed(3)}%</b>`;$('listCount').textContent=p.length+'명'}function list(){let q=c($('search').value).toLowerCase(),p=pool().filter(x=>(x.search+' '+x.name+' '+x.full+' '+x.detail).toLowerCase().includes(q)),s='';for(let t of ['named','mob','other']){let a=p.filter(x=>x.type===t).sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(!a.length)continue;s+=`<div class="section">${META[t]} · ${a.length}명</div>`+a.map(x=>`<div class="row"><b>${x.name}</b><span>${x.full!==x.name?x.full+' · ':''}${x.detail}</span></div>`).join('')}$('list').innerHTML=s||'<div class="row"><b>검색 결과 없음</b></div>'}function up(){stat();list();rh()}$('draw').onclick=draw;$('copy').onclick=copy;$('show').onclick=()=>{$('listPanel').classList.remove('hide');list();$('listPanel').scrollIntoView({behavior:'smooth',block:'start'})};$('close').onclick=()=>{$('listPanel').classList.add('hide');scrollTo({top:0,behavior:'smooth'})};$('search').oninput=list;for(let id of ['includeMobs','includeOthers'])$(id).onchange=()=>{try{localStorage.setItem('kv5'+id,$(id).checked?'1':'0')}catch(e){}up()};try{if(localStorage.getItem('kv5includeMobs')==='0')$('includeMobs').checked=false;if(localStorage.getItem('kv5includeOthers')==='0')$('includeOthers').checked=false}catch(e){}up();load();
